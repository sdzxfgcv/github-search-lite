name: Build Lite APK

on:
  push:
    branches: [main, master, komi-api]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and measure APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: komi-lite-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          gh release create komi-v0.1 "$APK_PATH" \
            --title "Komi Lite v0.1（komi-api 分支）" \
            --notes "用 Komi 后端 API 的缩小版：发现 / 搜索 / 仓库详情 / releases 产物，零第三方依赖。" \
            --target "$GITHUB_SHA" || \
          gh release upload komi-v0.1 "$APK_PATH" --clobber
